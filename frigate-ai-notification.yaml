blueprint:
  name: FrigateVision - Multi-Camera Priority (Direct Frigate Media)
  description: >
    Watches multiple Frigate cameras with a configurable priority order.
    When events fire across cameras within a short collection window, the
    highest-priority camera wins LLM analysis. Lower-priority simultaneous
    detections are mentioned in the notification but not analyzed separately.

    This version uses direct Frigate event media URLs instead of Home Assistant
    proxy URLs for snapshots/clips, and uses a direct local Frigate clip URL
    for LLM Vision video analysis.

  domain: automation

  input:
    cameras:
      name: Frigate Camera Entities (Priority Order)
      description: >
        Select all cameras to monitor. Order matters - cameras listed first
        have higher priority. If multiple cameras detect something within
        the collection window, the first camera in this list wins LLM analysis.
      selector:
        entity:
          domain:
            - camera
          multiple: true

    labels:
      name: Labels to Notify On
      description: Leave empty to match all labels.
      default:
        - person
      selector:
        select:
          multiple: true
          options:
            - person
            - dog
            - cat
            - car
            - package
            - bicycle
            - face
          sort: false
          custom_value: false

    helper:
      name: Helper (Input Boolean)
      description: Input Boolean used to prevent concurrent LLM Vision runs.
      selector:
        entity:
          domain:
            - input_boolean
          multiple: false

    cooldown:
      name: Cooldown
      description: Minimum time between notifications (per camera group).
      selector:
        duration:
          enable_day: true

    collection_window:
      name: Priority Collection Window (seconds)
      description: >
        How long to wait after the first event fires before picking the
        highest-priority camera. Events from multiple cameras within this
        window are compared. 3-8 seconds is a good starting point.
      default: 5
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: seconds
          mode: slider

    notify_device:
      name: Mobile Device(s)
      description: Phone or tablet(s) with the HA app to receive notifications.
      selector:
        device:
          integration: mobile_app
          multiple: true

    ios_live_view:
      name: iOS Notification
      description: Enable for iOS enhanced notification support.
      default: false
      selector:
        boolean: {}

    append:
      name: Append Camera
      description: Add "Camera" to the end of camera names in notifications.
      default: false
      selector:
        boolean: {}

    expand:
      name: Expand Cam to Camera
      default: false
      selector:
        boolean: {}

    dashboard:
      name: Event Summary Dashboard URI
      description: URI opened when "View Summary" action is tapped.
      default: ""
      selector:
        text: {}

    generate_title:
      name: Generate Event Title
      default: true
      selector:
        boolean: {}

    include_filename:
      name: Include Filenames
      default: false
      selector:
        boolean: {}

    expose_images:
      name: Expose Images
      description: Save analyzed frames to /www/llmvision.
      default: true
      selector:
        boolean: {}

    provider:
      name: Provider
      selector:
        config_entry:
          integration: llmvision

    model:
      name: Model
      default: gemini-2.0-flash
      selector:
        text:
          multiline: false
          multiple: false

    prompt:
      name: LLMVision Prompt
      default: >
        Summarize the observed events using clear, neutral third-person language.
        Use timestamps to ensure the summary follows the correct chronological order.
        Focus on moving subjects such as people, vehicles, animals, packages,
        equipment, or other active elements. Ignore static background objects unless
        directly interacted with. Include stationary vehicles only if they are clearly
        identifiable as delivery or emergency vehicles, mentioning any visible company
        names or uniform details. Describe activity relevant to the general monitored
        area without referencing camera angles, timestamps, or observers. Present the
        events as if witnessed in real time, avoiding frame-by-frame descriptions or
        introductory phrases. Summarize naturally in a single, cohesive narrative,
        keeping it concise and suitable for brief notifications. When context strongly
        suggests a likely outcome, describe it confidently. Do not mention the absence
        of activity or objects, nor conclude with statements about what was or wasn't
        observed.
      selector:
        text:
          multiline: true
          multiple: false

    max_tokens:
      name: Maximum Tokens
      default: 20
      selector:
        number:
          min: 1
          max: 100
          mode: slider
          step: 1

    temperature:
      name: Temperature
      default: 0.1
      selector:
        number:
          min: 0.1
          max: 1.0
          step: 0.1
          mode: slider

    max_frames:
      name: Total Frames
      default: 3
      selector:
        number:
          min: 1
          max: 60
          mode: slider
          step: 1

    frigate_retry_attempts:
      name: Retry Attempts
      default: 4
      selector:
        number:
          min: 1
          max: 20
          mode: slider
          step: 1

    frigate_retry_time:
      name: Retry Timing
      selector:
        duration: {}

    target_width:
      name: Target Width
      default: 1920
      selector:
        number:
          min: 480
          max: 3840
          mode: slider
          step: 20

    sublabel:
      name: Include Sublabels
      default: true
      selector:
        boolean: {}

    base_url:
      name: External Home Assistant URL
      description: >
        Public-facing URL for Home Assistant. Used only for dashboard links if needed.
      default: https://your.ddns:8123
      selector:
        text: {}

    ha_reverse_proxied:
      name: Home Assistant is Reverse Proxied
      description: >
        Enable when HA is accessible without a port number via a reverse proxy.
      default: false
      selector:
        boolean: {}

    local_url:
      name: Internal Home Assistant URL
      description: >
        Internal URL for Home Assistant. Retained for compatibility but not used
        for Frigate media in this direct-media version.
      default: http://192.168.250.1:8123
      selector:
        text: {}

    local_ha_reverse_proxied:
      name: Local HA Access is Also Reverse Proxied
      description: >
        Retained for compatibility.
      default: false
      selector:
        boolean: {}

    frigate_url:
      name: External Frigate URL
      description: >
        Public-facing Frigate UI base URL, used for the "Open Frigate" action.
        Example: https://frigate.yourdomain.com or http://192.168.178.5:5000
      default: ""
      selector:
        text: {}

    frigate_reverse_proxied:
      name: Frigate is Reverse Proxied
      description: >
        Retained for compatibility when frigate_url is blank.
      default: false
      selector:
        boolean: {}

    frigate_media_url:
      name: Direct Frigate Media URL
      description: >
        Direct Frigate base URL used for notification snapshots and clips.
        Example: http://192.168.178.5:5000
      default: ""
      selector:
        text: {}

    frigate_media_url_local:
      name: Direct Local Frigate Media URL for LLM Vision
      description: >
        Local Frigate base URL used by LLM Vision to fetch clip.mp4 with video_file.
        Usually the same as Direct Frigate Media URL. Example: http://192.168.178.5:5000
      default: ""
      selector:
        text: {}

    debug:
      name: Debugging
      default: false
      selector:
        boolean: {}

    notification_timeout:
      name: Notification Timeout (minutes)
      default: 10
      selector:
        number:
          min: 1
          max: 120
          step: 1
          unit_of_measurement: minutes
          mode: slider

trigger:
  - trigger: mqtt
    topic: frigate/events
    id: frigate-event

actions:
  - variables:
      input_cameras: !input cameras
      input_labels: !input labels
      input_collection_window: !input collection_window
      input_append: !input append
      input_expand: !input expand
      input_dashboard: !input dashboard
      input_provider: !input provider
      input_frigate_retry_attempts: !input frigate_retry_attempts
      input_frigate_retry_time: !input frigate_retry_time
      input_frigate_retry_seconds: >-
        {% set d = input_frigate_retry_time %}
        {{ (d.hours | default(0)) * 3600 + (d.minutes | default(0)) * 60 + (d.seconds | default(0)) }}
      input_max_frames: !input max_frames
      input_notification_timeout: !input notification_timeout
      input_ios_live_view: !input ios_live_view
      input_include_filename: !input include_filename
      input_generate_title: !input generate_title
      input_expose_images: !input expose_images
      input_model: !input model
      input_target_width: !input target_width
      input_max_tokens: !input max_tokens
      input_temperature: !input temperature
      input_prompt: !input prompt
      input_sublabel: !input sublabel
      input_cooldown: !input cooldown
      input_helper: !input helper
      input_debug: !input debug
      input_base_url: !input base_url
      input_ha_reverse_proxied: !input ha_reverse_proxied
      input_local_url: !input local_url
      input_local_ha_reverse_proxied: !input local_ha_reverse_proxied
      input_frigate_url: !input frigate_url
      input_frigate_reverse_proxied: !input frigate_reverse_proxied
      input_frigate_media_url: !input frigate_media_url
      input_frigate_media_url_local: !input frigate_media_url_local
      raw_device: !input notify_device

      triggered_camera: >-
        {{ trigger.payload_json['after']['camera'] | lower | replace('-', '_') }}
      camera_priority_list: >-
        {{ input_cameras | map('replace', 'camera.', '') | map('lower') | map('replace', '-', '_') | list }}
      camera_is_watched: >-
        {{ triggered_camera in camera_priority_list }}
      object: "{{ trigger.payload_json['after']['label'] | lower }}"
      labels: >-
        {{ input_labels | default([], true) | list | map('lower') | list }}

  - condition: template
    value_template: >-
      {{ camera_is_watched and ((labels | length == 0) or (object in labels)) }}

  - variables:
      competing_events: >-
        {{ [{'camera': triggered_camera, 'id': trigger.payload_json['after']['id'], 'label': trigger.payload_json['after']['label']}] }}

  - wait_for_trigger:
      - trigger: mqtt
        topic: frigate/events
    timeout:
      seconds: "{{ input_collection_window }}"
    continue_on_timeout: true

  - variables:
      extra_camera: >-
        {% if wait.trigger %}
          {{ wait.trigger.payload_json['after']['camera'] | lower | replace('-', '_') }}
        {% else %}''{% endif %}
      extra_label: >-
        {% if wait.trigger %}{{ wait.trigger.payload_json['after']['label'] | lower }}{% else %}''{% endif %}
      extra_id: >-
        {% if wait.trigger %}{{ wait.trigger.payload_json['after']['id'] }}{% else %}''{% endif %}

      all_events: >-
        {% set base = competing_events %}
        {% if extra_camera and extra_camera in camera_priority_list and ((labels | length == 0) or (extra_label in labels)) and extra_camera != triggered_camera %}
          {{ base + [{'camera': extra_camera, 'id': extra_id, 'label': extra_label}] }}
        {% else %}
          {{ base }}
        {% endif %}

      winning_event: >-
        {% set ns = namespace(best=none, best_rank=999) %}
        {% for ev in all_events %}
          {% set rank = camera_priority_list.index(ev.camera) if ev.camera in camera_priority_list else 999 %}
          {% if rank < ns.best_rank %}
            {% set ns.best = ev %}
            {% set ns.best_rank = rank %}
          {% endif %}
        {% endfor %}
        {{ ns.best }}

      secondary_cameras: >-
        {% set winner = winning_event.camera %}
        {{ all_events | selectattr('camera', '!=', winner) | map(attribute='camera') | list }}

      camera: "{{ winning_event.camera }}"
      id: "{{ winning_event.id }}"
      object: "{{ winning_event.label | lower }}"
      label: "{{ winning_event.label | title }}"

      _base: "{{ input_base_url.rstrip('/') }}"
      _frigate_raw: "{{ input_frigate_url.rstrip('/') }}"
      _frigate_media_raw: "{{ input_frigate_media_url.rstrip('/') }}"
      _frigate_media_local_raw: "{{ input_frigate_media_url_local.rstrip('/') }}"

      base_url: >-
        {% if input_ha_reverse_proxied %}
          {{ _base }}
        {% else %}
          {{ _base ~ ':8123' }}
        {% endif %}

      frigate_base_url: >-
        {% if _frigate_raw %}
          {{ _frigate_raw }}
        {% elif input_frigate_reverse_proxied %}
          {{ _base }}
        {% else %}
          {{ _base ~ ':8971' }}
        {% endif %}

      frigate_media_base_url: >-
        {% if _frigate_media_raw %}
          {{ _frigate_media_raw }}
        {% elif _frigate_raw %}
          {{ _frigate_raw }}
        {% elif input_frigate_reverse_proxied %}
          {{ _base }}
        {% else %}
          {{ _base ~ ':8971' }}
        {% endif %}

      frigate_media_base_url_local: >-
        {% if _frigate_media_local_raw %}
          {{ _frigate_media_local_raw }}
        {% elif _frigate_media_raw %}
          {{ _frigate_media_raw }}
        {% elif _frigate_raw %}
          {{ _frigate_raw }}
        {% elif input_frigate_reverse_proxied %}
          {{ _base }}
        {% else %}
          {{ _base ~ ':8971' }}
        {% endif %}

      local_clip_url: "{{ frigate_media_base_url_local }}/api/events/{{ id }}/clip.mp4"
      clip_url: "{{ frigate_media_base_url }}/api/events/{{ id }}/clip.mp4"
      snapshot_url: "{{ frigate_media_base_url }}/api/events/{{ id }}/snapshot.jpg"
      thumbnail_url: "{{ snapshot_url }}"
      thumbnail_android_url: "{{ snapshot_url }}"
      frigate_review_url: "{{ frigate_base_url }}/review?camera={{ camera }}&id={{ id }}"

      camera_name: >-
        {% set name = camera | replace('_', ' ') | title %}
        {% if input_expand %}
          {% set name = name | regex_replace('(?i)\\bcam\\b', 'Camera') %}
        {% endif %}
        {{ name ~ (' Camera' if input_append else '') }}

      cooldown: >-
        {{ '%02d:%02d:%02d' | format(
          input_cooldown.hours + (input_cooldown.days * 24),
          input_cooldown.minutes,
          input_cooldown.seconds
        ) }}

      icon: >-
        mdi:{{
          'account-outline' if label == 'Person'
          else 'dog' if label == 'Dog'
          else 'cat' if label == 'Cat'
          else 'car' if label == 'Car'
          else 'home-assistant'
        }}

      secondary_note: >-
        {% if secondary_cameras | length %}
          Also detected on: {{ secondary_cameras | map('replace', '_', ' ') | map('title') | join(', ') }}.
        {% else %}''{% endif %}

      title: ""
      message: >-
        A {{ label }} was detected on the {{ camera_name }}.
        {{ secondary_note }}

      alert_once: true
      update_thumbnail: true
      sub_label: ""
      notify_tag: "{{ id }}"
      notify_channel: "{{ camera_name }} Notifications"

  - repeat:
      for_each: "{{ raw_device }}"
      sequence:
        - variables:
            input_notify_device: >-
              {{ 'notify.mobile_app_' ~ (device_attr(repeat.item, 'name') | lower | replace(' ', '_') | replace("'", '') | replace('`', '') | replace('"', '') | trim) }}
        - service: "{{ input_notify_device }}"
          data:
            title: "{{ title }}"
            message: "{{ message }}"
            data:
              channel: "{{ notify_channel }}"
              timeout: "{{ input_notification_timeout * 60 | int }}"
              tag: "{{ notify_tag }}"
              group: "{{ camera_name }}"
              notification_icon: "{{ icon }}"
              data:
                ttl: 0
                priority: high
              attachment:
                url: "{{ thumbnail_url }}"
              image: "{{ thumbnail_android_url }}"
              clickAction: "{{ clip_url }}"
              push:
                interruption-level: active
              alert_once: "{{ alert_once }}"
              actions:
                - action: URI
                  title: View Clip
                  uri: "{{ clip_url }}"
                - action: URI
                  title: View Summary
                  uri: "{{ input_dashboard }}"
                - action: URI
                  title: Open Frigate
                  uri: "{{ frigate_review_url }}"

  - repeat:
      sequence:
        - wait_for_trigger:
            - trigger: mqtt
              topic: frigate/events
              payload: "{{ id }}"
              value_template: "{{ value_json['after']['id'] }}"
          timeout: "{{ input_cooldown }}"
          continue_on_timeout: true

        - variables:
            event: "{{ wait.trigger.payload_json if wait.trigger else {} }}"
            new_snapshot: >-
              {{ wait.trigger and update_thumbnail and event['before']['snapshot_time'] != event['after']['snapshot_time'] }}
            sub_label: "{{ event['after']['sub_label'] if wait.trigger else '' }}"
            sub_label_changed: >-
              {{ wait.trigger and sub_label != event['before']['sub_label'] }}

            title: >-
              {% if sub_label %}
                {% set ns = namespace(names=[]) %}
                {% for i in range(0, sub_label | length, 2) %}
                  {% set ns.names = ns.names + [sub_label[i]] %}
                {% endfor %}
                {{ ns.names[:-1] | join(', ') ~ (', and ' if ns.names | length > 2 else ' and ') ~ ns.names[-1] if ns.names | length > 1 else ns.names[0] }}
                {% if ns.names | length > 1 %}were{% else %}was{% endif %}
                detected on the {{ camera_name }}.
              {% else %}
                A {{ label }} was detected on the {{ camera_name }}.
              {% endif %}

            message: >-
              {% if sub_label %}
              {% else %}
                A {{ label }} was detected on the {{ camera_name }}.
                {{ secondary_note }}
              {% endif %}

        - alias: Notify on snapshot update or sublabel change
          choose:
            - conditions:
                - condition: template
                  value_template: "{{ new_snapshot or sub_label_changed }}"
              sequence:
                - repeat:
                    for_each: "{{ raw_device }}"
                    sequence:
                      - variables:
                          input_notify_device: >-
                            {{ 'notify.mobile_app_' ~ (device_attr(repeat.item, 'name') | lower | replace(' ', '_') | replace("'", '') | replace('`', '') | replace('"', '') | trim) }}
                      - service: "{{ input_notify_device }}"
                        data:
                          title: "{{ title }}"
                          message: "{{ message }}"
                          data:
                            channel: "{{ notify_channel }}"
                            timeout: "{{ input_notification_timeout * 60 | int }}"
                            tag: "{{ notify_tag }}"
                            group: "{{ camera_name }}"
                            notification_icon: "{{ icon }}"
                            data:
                              ttl: 0
                              priority: high
                            attachment:
                              url: "{{ thumbnail_url }}"
                            image: "{{ thumbnail_android_url }}"
                            clickAction: "{{ clip_url }}"
                            push:
                              interruption-level: active
                            alert_once: "{{ alert_once }}"
                            actions:
                              - action: URI
                                title: View Clip
                                uri: "{{ clip_url }}"
                              - action: URI
                                title: View Summary
                                uri: "{{ input_dashboard }}"
                              - action: URI
                                title: Open Frigate
                                uri: "{{ frigate_review_url }}"
      until:
        - condition: template
          value_template: >-
            {{ not wait.trigger or wait.trigger.payload_json['type'] == 'end' }}

  - delay: "00:00:30"

  - alias: Wait if LLM Vision already running
    if:
      - condition: state
        entity_id: !input helper
        state: "on"
    then:
      - wait_for_trigger:
          - trigger: state
            entity_id: !input helper
            from: "on"
            to: "off"
        timeout:
          minutes: 3
        continue_on_timeout: false

  - action: input_boolean.turn_on
    target:
      entity_id: !input helper

  - alias: "LLM Vision: Analyze Winning Camera Clip"
    action: llmvision.video_analyzer
    data:
      remember: true
      model: "{{ input_model }}"
      provider: "{{ input_provider }}"
      frigate_retry_attempts: "{{ input_frigate_retry_attempts }}"
      frigate_retry_seconds: "{{ input_frigate_retry_seconds }}"
      max_frames: "{{ input_max_frames }}"
      include_filename: "{{ input_include_filename }}"
      target_width: "{{ input_target_width }}"
      max_tokens: "{{ input_max_tokens }}"
      temperature: "{{ input_temperature }}"
      generate_title: "{{ input_generate_title }}"
      expose_images: "{{ input_expose_images }}"
      video_file: "{{ local_clip_url }}"
      message: >-
        {% if input_sublabel and sub_label %}
          You are analyzing frames from a security video showing that {{ title | string }}.
        {% endif %}
        {% if secondary_cameras | length %}
          Note: simultaneous activity was also detected on {{ secondary_cameras | map('replace', '_', ' ') | map('title') | join(' and ') }}. Focus your analysis on the primary camera feed only.
        {% endif %}
        {{ input_prompt }}
    response_variable: response
    enabled: true

  - action: input_boolean.turn_off
    target:
      entity_id: !input helper

  - variables:
      title: >-
        {% if input_generate_title and (response.response_title | default('') | trim != '') %}
          {{ response.response_title }}
        {% else %}
          {{ title }}
        {% endif %}
      message: "{{ response.response_text | default(message) }}"

  - repeat:
      for_each: "{{ raw_device }}"
      sequence:
        - variables:
            input_notify_device: >-
              {{ 'notify.mobile_app_' ~ (device_attr(repeat.item, 'name') | lower | replace(' ', '_') | replace("'", '') | replace('`', '') | replace('"', '') | trim) }}
        - service: "{{ input_notify_device }}"
          data:
            title: "{{ title }}"
            message: "{{ message }}"
            data:
              channel: "{{ notify_channel }}"
              timeout: "{{ input_notification_timeout * 60 | int }}"
              tag: "{{ notify_tag }}"
              group: "{{ camera_name }}"
              notification_icon: "{{ icon }}"
              data:
                ttl: 0
                priority: high
              attachment:
                url: "{{ thumbnail_url }}"
              image: "{{ thumbnail_android_url }}"
              clickAction: "{{ clip_url }}"
              push:
                interruption-level: active
              alert_once: "{{ alert_once }}"
              actions:
                - action: URI
                  title: View Clip
                  uri: "{{ clip_url }}"
                - action: URI
                  title: View Summary
                  uri: "{{ input_dashboard }}"
                - action: URI
                  title: Open Frigate
                  uri: "{{ frigate_review_url }}"

  - delay: "{{ input_cooldown }}"

mode: single
